<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELUZA BINGO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10162f;
  color: white;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 25px 15px 50px;
}

h1 {
  font-size: 48px;
  margin: 10px 0;
}

.subtitle {
  font-size: 20px;
  color: #d5d5df;
  margin-bottom: 25px;
}

.card {
  background: #303653;
  border-radius: 25px;
  padding: 25px;
  margin: 20px 0;
}

.balance {
  font-size: 22px;
  font-weight: bold;
}

.called {
  background: #202640;
  border-radius: 20px;
  padding: 20px;
}

.called-label {
  font-size: 18px;
  color: #ddd;
}

.number {
  font-size: 65px;
  font-weight: bold;
  margin: 10px;
}

.letter {
  font-size: 25px;
  font-weight: bold;
}

button {
  border: none;
  border-radius: 15px;
  padding: 16px 25px;
  margin: 8px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #22c55e;
  color: white;
}

.stop {
  background: #ef4444;
  color: white;
}

.reset {
  background: #8b5cf6;
  color: white;
}

button:disabled {
  opacity: 0.5;
}

.bingo-card {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.cell {
  background: white;
  color: #111827;
  border-radius: 12px;
  min-height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
}

.header {
  background: #e5e7eb;
}

.free {
  background: #a855f7;
  color: white;
}

.marked {
  background: #22c55e;
  color: white;
}

.history {
  font-size: 16px;
  line-height: 1.8;
  color: #ddd;
}

.status {
  font-size: 19px;
  margin: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <h1>👑 ELUZA BINGO</h1>
  <div class="subtitle">Play Bingo • Have Fun • Win</div>

  <div class="card">
    <div id="welcome" class="balance">
      Welcome, adda 👋
    </div>
    <br>
    💰 Demo Balance: <span id="balance">100</span> ETB
  </div>

  <div class="card called">
    <div class="called-label">CURRENT NUMBER</div>
    <div id="letter" class="letter">—</div>
    <div id="number" class="number">—</div>
    <div id="status" class="status">Press START GAME</div>

    <button class="start" id="startBtn" onclick="startGame()">
      🎲 START GAME
    </button>

    <button class="stop" id="stopBtn" onclick="stopGame()" disabled>
      ⛔ STOP
    </button>

    <button class="reset" onclick="resetGame()">
      🔄 RESET
    </button>
  </div>

  <div class="card">
    <h2>Your Bingo Card</h2>

    <div class="bingo-card" id="bingoCard">
      <div class="cell header">B</div>
      <div class="cell header">I</div>
      <div class="cell header">N</div>
      <div class="cell header">G</div>
      <div class="cell header">O</div>
    </div>
  </div>

  <div class="card">
    <h2>📢 Called Numbers</h2>
    <div id="history" class="history">
      No numbers called yet.
    </div>
  </div>

</div>

<script>

let numbers = [];
let calledNumbers = [];
let timer = null;
let playing = false;

const balance = 100;

/* Create Bingo card */
function createCard() {

  const card = document.getElementById("bingoCard");

  const columns = [
    randomNumbers(1, 15, 5),
    randomNumbers(16, 30, 5),
    randomNumbers(31, 45, 5),
    randomNumbers(46, 60, 5),
    randomNumbers(61, 75, 5)
  ];

  for (let row = 0; row < 5; row++) {

    for (let col = 0; col < 5; col++) {

      const cell = document.createElement("div");
      cell.className = "cell";

      if (row === 2 && col === 2) {

        cell.textContent = "FREE";
        cell.classList.add("free");

      } else {

        cell.textContent = columns[col][row];
        cell.dataset.number = columns[col][row];

        cell.onclick = function() {

          if (calledNumbers.includes(Number(this.dataset.number))) {
            this.classList.toggle("marked");
            checkBingo();
          }

        };
      }

      card.appendChild(cell);
    }
  }
}

/* Generate unique numbers */
function randomNumbers(min, max, count) {

  let result = [];

  while (result.length < count) {

    let n = Math.floor(Math.random() * (max - min + 1)) + min;

    if (!result.includes(n)) {
      result.push(n);
    }
  }

  return result;
}

/* Create all numbers 1-75 */
function createNumbers() {

  numbers = [];

  for (let i = 1; i <= 75; i++) {
    numbers.push(i);
  }

  numbers.sort(() => Math.random() - 0.5);
}

/* Start game */
function startGame() {

  if (playing) return;

  createNumbers();

  calledNumbers = [];
  playing = true;

  document.getElementById("startBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;

  document.getElementById("status").textContent =
    "Game running...";

  callNumber();

  timer = setInterval(callNumber, 3000);
}

/* Call next number */
function callNumber() {

  if (numbers.length === 0) {

    stopGame();

    document.getElementById("status").textContent =
      "All 75 numbers have been called.";

    return;
  }

  const n = numbers.shift();

  calledNumbers.push(n);

  let letter;

  if (n <= 15) {
    letter = "B";
  } else if (n <= 30) {
    letter = "I";
  } else if (n <= 45) {
    letter = "N";
  } else if (n <= 60) {
    letter = "G";
  } else {
    letter = "O";
  }

  document.getElementById("letter").textContent = letter;
  document.getElementById("number").textContent = n;

  document.getElementById("history").textContent =
    calledNumbers.join(" • ");

  markCalledNumber(n);
}

/* Highlight called number on card */
function markCalledNumber(n) {

  const cells = document.querySelectorAll(".cell");

  cells.forEach(cell => {

    if (Number(cell.dataset.number) === n) {

      cell.style.outline = "4px solid #facc15";
      cell.style.transform = "scale(1.05)";

    }

  });
}

/* Stop game */
function stopGame() {

  clearInterval(timer);

  timer = null;
  playing = false;

  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;

  document.getElementById("status").textContent =
    "Game paused.";
}

/* Reset */
function resetGame() {

  stopGame();

  calledNumbers = [];
  numbers = [];

  document.getElementById("letter").textContent = "—";
  document.getElementById("number").textContent = "—";
  document.getElementById("status").textContent =
    "Press START GAME";

  document.getElementById("history").textContent =
    "No numbers called yet.";

  document.getElementById("bingoCard").innerHTML = `
    <div class="cell header">B</div>
    <div class="cell header">I</div>
    <div class="cell header">N</div>
    <div class="cell header">G</div>
    <div class="cell header">O</div>
  `;

  createCard();
}

/* Check Bingo */
function checkBingo() {

  const cells = document.querySelectorAll(".cell");
  let marked = [];

  cells.forEach(cell => {

    if (
      cell.classList.contains("marked") ||
      cell.classList.contains("free")
    ) {
      marked.push(cell);
    }

  });

  if (marked.length >= 5) {

    document.getElementById("status").textContent =
      "🎉 BINGO! Check your winning line.";

  }
}

createCard();

</script>

</body>
</html>
